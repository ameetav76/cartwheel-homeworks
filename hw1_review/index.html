:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#22332f;background:#f5f7f5;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}textarea{width:100%;min-height:110px;resize:vertical;padding:12px;border:1px solid #b9cdbf;border-radius:8px;line-height:1.6}.observation-actions{display:flex;align-items:center;gap:12px;margin-top:10px}.save{background:#285c43;color:white;border:0;border-radius:7px;padding:9px 16px}button:disabled{cursor:default;opacity:.6}button{cursor:pointer}header{height:76px;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dce4df;background:white}h1{font-size:19px;margin:0 0 4px}header p,.muted{color:#65756e;font-size:13px;margin:0}header button{border:1px solid #c5d6cb;border-radius:8px;padding:9px 14px;color:#225440;background:#fff}main{display:grid;grid-template-columns:290px minmax(0,1fr);height:calc(100vh - 76px)}aside{padding:18px 12px;border-right:1px solid #dce4df;overflow:auto;background:#eef3ef}#search{width:100%;padding:10px;border:1px solid #ccd8cf;border-radius:8px;background:white}#count{padding:12px 4px;font-size:12px;color:#66776c}.conversation{display:block;width:100%;text-align:left;padding:14px;margin-bottom:8px;border:1px solid transparent;border-radius:10px;background:transparent;color:inherit}.conversation:hover{background:#e2ebe4}.conversation.active{background:white;border-color:#77a78b;box-shadow:0 2px 7px #2943330a}.row{display:flex;justify-content:space-between;gap:10px}.role{text-transform:capitalize;font-weight:650;font-size:13px}.id{font-size:12px;color:#64766b}.question{font-size:14px;line-height:1.5;margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}article{overflow:auto;padding:30px clamp(18px,4vw,60px)}#detail{max-width:1000px;margin:auto}h2{font-size:25px;letter-spacing:-.5px;margin:0 0 10px}.chips{display:flex;flex-wrap:wrap;gap:8px;margi .tabs{display:flex;gap:6px;margin-bottom:24px;border-bottom:1px solid #dce4df;padding-bottom:10px}.tabs button{padding:9px 16px;border:1px solid #ccd8cf;border-radius:8px;background:white;color:#355443}.tabs button[aria-pressed="true"]{background:#285c43;color:white;border-color:#285c43}[hidden]{display:none!important}main.summary-mode{grid-template-columns:minmax(0,1fr)}main.summary-mode aside{display:none}.summary-wrap{overflow:auto;border:1px solid #dbe5dd;border-radius:10px;background:white}.summary-table{border-collapse:collapse;width:100%;min-width:900px;table-layout:fixed}.summary-table th,.summary-table td{text-align:left;vertical-align:top;padding:16px;border-bottom:1px solid #e1e8e3;line-height:1.65;overflow-wrap:anywhere}.summary-table th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;background:#eaf0eb}.summary-table td{font-size:14px;white-space:pre-wrap}.summary-table th:nth-child(1){width:23%}.summary-table th:nth-child(2){width:32%}.summary-table th:nth-child(3){width:25%}.summary-table th:nth-child(4){width:20%}.open-record{padding:0;border:0;background:none;color:#246445;font-weight:650;text-align:left;text-decoration:underline}.summary-meta{font-size:12px;color:#68796e;line-height:1.6;margin:6px 0}.summary-tools{padding-left:18px;margin:0}.summary-tools li+li{margin-top:9px}

header .header-actions{display:flex;gap:8px;align-items:center}header a{font-size:13px;color:#285c43;border:1px solid #c5d6cb;border-radius:8px;padding:10px;text-decoration:none;background:white}.tabs{flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:20px 0}.metric{background:white;border:1px solid #dbe5dd;border-radius:9px;padding:15px;display:flex;flex-direction:column;gap:6px}.metric strong{font-size:25px}.coded-case{padding:14px 0;border-top:1px solid #e1e8e3}.coded-case summary{line-height:1.6}.coded-case blockquote,td blockquote{margin:10px 0;padding-left:12px;border-left:3px solid #b7cdbb}.analysis-table{border-collapse:collapse;width:100%;min-width:850px;table-layout:fixed}.analysis-table th,.analysis-table td{vertical-align:top;text-align:left;padding:15px;border-bottom:1px solid #dce4df;line-height:1.6;overflow-wrap:anywhere}.analysis-table th{background:#eaf0eb;font-size:12px}.analysis-table th:first-child{width:24%}.analysis-table th:nth-child(2){width:36%}.report-text{max-height:600px;overflow:auto}h3{font-size:18px;margin:8px 0 12px}.snapshot-banner{background:#e8eee9;padding:12px 24px;font-size:13px;line-height:1.5}body.snapshot main{height:calc(100vh - 126px)}@media print{header,.tabs,aside,.snapshot-banner{display:none!important}main{display:block;height:auto!important}article{overflow:visible;padding:0}.summary-wrap{overflow:visible}.summary-table,.analysis-table{min-width:0}pre{white-space:pre-wrap}.card{break-inside:avoid}}

<header><div><h1>Cartwheel <span style="font-weight:400;color:#708177">/ HW1 review</span></h1><p>Conversation records & observations · no model calls</p></div><div class="header-actions"><a id="download" href="/export.html" download="cartwheel-hw1-review.html">Download HTML</a><button id="refresh">Refresh</button></div></header><div id="snapshot-banner" class="snapshot-banner" hidden></div>
<main><aside aria-label="Conversations"><input id="search" aria-label="Search conversations" placeholder="Search case, role, ID, or question…"><div id="count" aria-live="polite"></div><nav id="list"></nav><p class="help">Source: hw1-session.jsonl<br>Refresh after a new conversation is saved.</p></aside><article><div id="errors"></div><nav class="tabs" aria-label="Review views"><button id="conversation-tab" aria-pressed="true">Conversation</button><button id="summary-tab" aria-pressed="false">Summary</button><button id="themes-tab" aria-pressed="false">All-run Analysis</button><button id="models-tab" aria-pressed="false">Model Comparison</button></nav><div id="detail" aria-live="polite"></div><div id="summary" hidden></div><div id="themes" hidden></div><div id="models" hidden></div></article></main>
<!-- EXPORT_DATA -->
<script>
'use strict';
let conversations=[],selected=null,view='conversation';
const drafts=new Map();
const embedded=document.getElementById('embedded-data');
const offlineData=embedded?JSON.parse(embedded.textContent):null;
let analysisData={analysis:null,report:'',stale:false};
const $=id=>document.getElementById(id);
function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node}
function pretty(value){return JSON.stringify(value,null,2)??'Not recorded'}
function section(title){$('detail').append(el('div','section-label',title))}
function list(){const query=$('search').value.toLowerCase();const filtered=conversations.filter(item=>`${conversationLabel(item)} ${item.record.role} ${item.record.user_id} ${item.record.store_id??''} ${item.record.request}`.toLowerCase().includes(query));$('count').textContent=`${filtered.length} of ${conversations.length} conversations`;$('list').replaceChildren();for(const item of filtered){const r=item.record;const button=el('button','conversation'+(item.line===selected?' active':''));button.setAttribute('aria-pressed',String(item.line===selected));const row=el('div','row');row.append(el('span','role',`${conversationLabel(item)} · ${r.role??'Unknown role'}`),el('span','id',`User ${r.user_id??'—'}`));button.append(row,el('div','question',r.request??'No request recorded'));button.onclick=()=>{selected=item.line;setView('conversation')};$('list').append(button)}if(!filtered.length)$('list').append(el('p','help','No matching conversations.'))}
function render(){const root=$('detail');root.replaceChildren();const item=conversations.find(item=>item.line===selected);if(!item){root.append(el('div','empty','No conversations saved yet. Completed records will appear here.'));return}const r=item.record;const index=conversations.indexOf(item)+1;root.append(el('h2','',conversationLabel(item)));const chips=el('div','chips');for(const label of [r.role,`User ${r.user_id??'—'}`,r.store_id!=null?`Store ${r.store_id}`:null,`JSONL line ${item.line}`].filter(Boolean))chips.append(el('span','chip',label));root.append(chips);
section('Your observation / test result');
const noteCard=el('div','card');const noteLabel=el('label','','Brief observation');noteLabel.htmlFor='observation';const textarea=el('textarea');textarea.id='observation';textarea.placeholder='What did you notice? Describe any incorrect behavior, missing information, or useful result.';textarea.value=drafts.has(item.line)?drafts.get(item.line):(r.observation??'');const actions=el('div','observation-actions');const save=el('button','save','Save observation');const status=el('span','muted',drafts.has(item.line)?'Unsaved changes':'');status.id='save-status';status.setAttribute('role','status');textarea.oninput=()=>{if(textarea.value===(r.observation??'')){drafts.delete(item.line);status.textContent=''}else{drafts.set(item.line,textarea.value);status.textContent='Unsaved changes'}};save.onclick=async()=>{save.disabled=true;textarea.disabled=true;status.textContent='Saving…';try{const response=await fetch('/api/observation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({line:item.line,revision:item.revision,observation:textarea.value})});const result=await response.json();if(!response.ok)throw Error(result.error??'Save failed');item.record=result.record;item.revision=result.revision;drafts.delete(item.line);analysisData.stale=true;if(selected===item.line&&view==='conversation'){render();$('save-status').textContent='Saved to hw1-session.jsonl'}renderSummary()}catch(error){status.textContent=error.message}finally{save.disabled=false;textarea.disabled=false}};if(offlineData){textarea.readOnly=true;textarea.placeholder='No observation was saved for this run.';save.hidden=true;status.textContent='Read-only shared snapshot'}actions.append(save,status);noteCard.append(noteLabel,textarea,actions,el('p','help',offlineData?'Saved observations are included below. Editing is available in the local viewer, not this shared snapshot.':'Saved as the observation field in this conversation’s JSONL record. Your assessment and recorded evidence remain unchanged.'));root.append(noteCard);
section('User request');root.append(el('div','card question-card response',r.request??'Not recorded'));
if(Array.isArray(r.turns)&&r.turns.length>1){section('Complete conversation · all turns');r.turns.forEach((turn,i)=>{const card=el('details','card');card.open=true;card.append(el('summary','',`Turn ${i+1}`),el('div','json-label','User request'),el('div','response',turn.request??'Not recorded'),el('div','json-label','Tool calls and results'),el('pre','',pretty(turn.tool_calls)),el('div','json-label','Agent response'),el('div','response',turn.response??'Not recorded'));root.append(card)})}

section('Recorded tool calls');root.append(el('p','help','Shown in recorded order. Internal model reasoning and unrecorded intermediate messages are not included.'));
const calls=Array.isArray(r.tool_calls)?r.tool_calls:[];if(!calls.length)root.append(el('div','card muted','No tool calls recorded.'));
calls.forEach((call,i)=>{const card=el('div','card');const heading=el('div','tool-header');heading.append(el('h3','tool-title',`${i+1}. ${call.name??'Unknown tool'}`));const ok=call.result?.ok;heading.append(el('span','status'+(ok===false?' failed':''),ok===true?'Success':ok===false?'Tool returned an error':'Result recorded'));card.append(heading,el('div','json-label','Arguments'),el('pre','',pretty(call.arguments)),el('div','json-label','Tool result'),el('pre','',pretty(call.result)));root.append(card)});
section('Agent final response');root.append(el('div','card response',r.response??'Not recorded'));
section('Your assessment');const card=el('div','card');const dl=el('dl','assessment');const judgment=r.met_requirement===true?'Met requirement':r.met_requirement===false?'Did not meet requirement':'Pending';for(const [name,value] of [['Expected',r.expected??'Pending'],['Requirement',r.requirement??'No single requirement'],['Assessment',judgment],['Problem source',r.problem_source??(r.met_requirement===true?'None':'Not recorded')]])dl.append(el('dt','',name),el('dd','',value));card.append(dl);root.append(card);
const raw=el('details','card');raw.append(el('summary','','View complete JSON record'),el('pre','',pretty(r)));root.append(raw)}
function conversationLabel(item){const r=item.record;if(!r.scenario_id)return `Conversation ${conversations.indexOf(item)+1}`;const runs=conversations.filter(entry=>entry.record.scenario_id===r.scenario_id);const index=runs.indexOf(item);return r.scenario_id+(index>0?` (rerun ${index})`:'')}
function toolSummary(call){const result=call.result;let outcome='Result recorded';if(result&&typeof result==='object'){if(result.ok===false)outcome=`Error: ${result.error??'unspecified'}`;else if(result.ok===true)outcome='Success';const status=result.status??result.order?.status;if(status!=null)outcome+=`; status: ${status}`;if(typeof result.order?.refund_eligible==='boolean')outcome+=`; refund eligible: ${result.order.refund_eligible}`;if(result.refund_id!=null)outcome+=`; refund ID: ${result.refund_id}`;if(result.ticket_id!=null)outcome+=`; ticket ID: ${result.ticket_id}`}return `${call.name??'Unknown tool'}(${pretty(call.arguments)}) → ${outcome}`}
function renderSummary(){const root=$('summary');root.replaceChildren();root.append(el('h2','','Conversation summary'),el('p','help',`${conversations.length} recorded runs. Each rerun has its own row. Activity summaries use recorded tool calls only; they do not assign a pass/fail judgment. Click a conversation to review evidence or edit your observation.`));if(!conversations.length){root.append(el('div','empty','No conversations saved yet.'));return}const wrap=el('div','summary-wrap');const table=el('table','summary-table');const head=el('thead');const header=el('tr');for(const label of ['Conversation','Agent response','Summary of what agent did','My observation']){const th=el('th','',label);th.scope='col';header.append(th)}head.append(header);table.append(head);const body=el('tbody');for(const item of conversations){const r=item.record;const row=el('tr');const conversation=el('td');const link=el('button','open-record',conversationLabel(item));link.onclick=()=>{selected=item.line;setView('conversation')};conversation.append(link,el('div','summary-meta',`${r.role??'Unknown role'} · User ${r.user_id??'—'}${r.store_id!=null?` · Store ${r.store_id}`:''}`),el('div','summary-meta',`${r.model??'Model not recorded'}
Prompt: ${r.prompt_version??'Not recorded'}`),el('div','',r.request??'Not recorded'));const response=el('td','',r.response??'Not recorded');const activity=el('td');const calls=Array.isArray(r.tool_calls)?r.tool_calls:[];if(calls.length){const steps=el('ol','summary-tools');for(const call of calls)steps.append(el('li','',toolSummary(call)));activity.append(steps)}else activity.append(el('span','','No tool calls recorded. Responded directly.'));const observation=el('td','',r.observation?.trim()?r.observation:'No saved observation.');row.append(conversation,response,activity,observation);body.append(row)}table.append(body);wrap.append(table);root.append(wrap)}
function setView(next){view=next;document.querySelector('main').classList.toggle('summary-mode',view!=='conversation');$('detail').hidden=view!=='conversation';for(const tab of ['conversation','summary','themes','models']){if(tab!=='conversation')$(tab).hidden=view!==tab;$(tab+'-tab').setAttribute('aria-pressed',String(view===tab))}list();if(view==='summary')renderSummary();else if(view==='themes')renderThemes();else if(view==='models')renderModels();else render()}
const themeNames={order_verification:'Order verification and action control',policy_grounding:'Policy grounding and explanation',human_handoff:'Human handoff and approval routing',purchase_identification:'Intended purchase and clarification',scope_boundaries:'Scope boundaries',data_fidelity:'Accuracy of retrieved facts and missing data',permission_explanation:'Permission enforcement and explanation',refund_history:'Refund-history retrieval without a new write'};
const themeDescriptions={order_verification:'Compare successful order checks and authorized actions with refusals based on user wording. An omitted prerequisite before a write differs from skipping a preferred lookup before refusal.',policy_grounding:'Compare correct store-policy retrieval, precedence and citations with missed overrides, wrong deadlines and unsupported fees.',human_handoff:'Compare completed approval queues and support tickets with referrals that do not create a handoff. A refund approval queue and an escalation ticket are different mechanisms.',purchase_identification:'Compare candidate retrieval and clarification with selecting a purchase before its identity is established.',scope_boundaries:'Check whether the agent stays within Cartwheel support and avoids unnecessary calls for unrelated requests.',data_fidelity:'Check whether the final answer represents returned facts accurately and handles missing information without invention.',permission_explanation:'Separate effective access control from how clearly the agent explains a denial.',refund_history:'Read existing refund records without creating a new refund or implying bank settlement.'};
function openEvidence(line){const item=conversations.find(entry=>entry.line===line);if(item){selected=line;setView('conversation')}}
function evidenceButton(line){const item=conversations.find(entry=>entry.line===line);const button=el('button','open-record',item?conversationLabel(item):`Source line ${line}`);button.onclick=()=>openEvidence(line);return button}
function analysisNotice(root){if(analysisData.stale)root.append(el('div','notice','Saved analysis predates changes to the JSONL. Current conversations and notes are shown in the review tabs; codes and comparison notes below describe the saved analysis snapshot. Re-analyze before drawing new conclusions.'))}
let analysisFilter='all';
function matchesAnalysisFilter(entry){if(analysisFilter==='pass')return entry.structured_label==='PASS'||entry.note_label==='PASS';if(analysisFilter==='fail')return entry.structured_label==='FAIL'||entry.note_label==='FAIL';if(analysisFilter==='pending')return entry.structured_label==='PENDING';if(analysisFilter==='conflict')return entry.label_conflict;return true}
function renderThemes(){const root=$('themes');root.replaceChildren();root.append(el('h2','','All-run analysis'),el('p','help','Every recorded run is included: passes, failures, reruns and pending assessments. Open codes name observed behaviors; axial themes group strengths and concerns. Saved UI observations are quoted verbatim; missing notes use the stored assessment rationale where available. Analyst interpretation does not change your labels.'));
 const analysis=analysisData.analysis;if(!analysis){root.append(el('div','empty','No saved all-run analysis is available yet.'));return}analysisNotice(root);
 const counts=analysis.counts;const metrics=el('div','metrics');for(const [label,value] of [['Recorded runs',counts.recorded_runs],['Distinct scenarios',counts.distinct_scenarios],['With saved UI notes',counts.with_saved_observation],['Without UI notes',counts.without_saved_observation],['Structured PASS',counts.structured_pass],['Structured FAIL',counts.structured_fail],['Structured pending',counts.structured_pending],['Label conflicts',counts.conflicting_labels]]){const card=el('div','metric');card.append(el('strong','',String(value)),el('span','muted',label));metrics.append(card)}root.append(metrics,el('p','help',`${counts.pass_in_either_source} runs have PASS in a note or structured assessment; ${counts.fail_in_either_source} have FAIL in either source. They overlap only if labels conflict and are not a production pass rate. Primary theme counts cover all ${counts.recorded_runs} runs exactly once; open codes can overlap.`));
 const controls=el('div','analysis-filters');const label=el('label','','Show runs: ');label.htmlFor='analysis-filter';const select=el('select');select.id='analysis-filter';for(const [value,text] of [['all','All runs'],['pass','PASS in either label source'],['fail','FAIL in either label source'],['pending','Structured assessment pending'],['conflict','Conflicting labels']]){const option=el('option','',text);option.value=value;select.append(option)}select.value=analysisFilter;select.onchange=()=>{analysisFilter=select.value;renderThemes()};controls.append(label,select);root.append(controls);
 let visible=0;for(const [key,count] of Object.entries(analysis.primary_category_counts)){const entries=analysis.coded_records.filter(entry=>entry.primary_category===key&&matchesAnalysisFilter(entry));if(!entries.length)continue;visible+=entries.length;const card=el('section','card');card.append(el('h3','',`${themeNames[key]??key} · ${entries.length} of ${count} runs`),el('p','help',themeDescriptions[key]??''));for(const entry of entries){const detail=el('details','coded-case');const title=el('summary');const sourceItem=conversations.find(item=>item.line===entry.source_line);title.append(el('span','',`${sourceItem?conversationLabel(sourceItem):entry.scenario_id} · ${entry.model??'Model not recorded'} · stored: ${entry.structured_label} · note: ${entry.note_label??'No note label'}`));detail.append(title);if(entry.label_conflict)detail.append(el('div','notice','Conflicting student labels: the structured assessment and saved observation disagree. Both are preserved.'));detail.append(el('div','json-label','Your saved UI observation'),el('blockquote','response',entry.student_observation||'No saved UI observation for this run.'));if(entry.student_assessment_rationale)detail.append(el('div','json-label','Stored student assessment rationale'),el('p','response',entry.student_assessment_rationale));detail.append(el('div','json-label','What worked · analyst interpretation'),el('p','response',entry.observed_strengths),el('div','json-label','Concerns or limitations · analyst interpretation'),el('p','response',entry.observed_concerns),el('div','json-label','Open codes'),el('p','response',entry.open_codes.map(code=>code.replaceAll('_',' ')).join(' · ')),el('div','json-label','Interpretation boundary'),el('p','help',entry.interpretation_limit),evidenceButton(entry.source_line));card.append(detail)}root.append(card)}if(!visible)root.append(el('div','empty','No runs match this filter.'));
 const synthesis=el('div','card');synthesis.append(el('h3','','Patterns across successes and failures'),el('p','response','The contrast is conditional, not “more tools is always better.” S08 correctly refuses without tools. S02 is accepted as a concise eligibility-based decline. S03 correctly queues human approval without a separate escalation ticket. M07 verifies and completes an authorized cancellation, then its repeat correctly avoids cancelling again. S04 Sol and M06 Sol add verified, policy-grounded responses, while mini failures often stop at a user claim, eligibility flag, or generic policy. Establish the intended purchase before writing, and distinguish information retrieval from accurate interpretation.'));root.append(synthesis);
 if(analysisData.report){const report=el('details','card');report.append(el('summary','','Complete all-run analysis and instructor explanation'),el('pre','report-text',analysisData.report));root.append(report)}
}

const comparisonConclusions={C01:{finding:'The final targeted instruction improved the observed GPT-4o-mini run.',conditions:'Same exact email-change request, shopper1, fresh sessions and identical starting database snapshots. Compare baseline and refined mini to evaluate the prompt; Sol is a separate comparison.',difference:'Mini baseline refused with no ticket; first edit offered a ticket but made no call. Sol with the first edit created a ticket. The refined mini instruction also created a ticket and reported its number.',limit:'Both ticket155 values came from independent temporary databases. The accepted mini rerun is one trial, not general reliability proof. Historical prompt hashes are preserved; final source cleanup fixes an accidental heading typo and whitespace.'},S04:{finding:'Sol performed better in the observed same-prompt comparison.',conditions:'Compare mini and Sol at prompt 1db28940e64b: same request, shopper, and order state. The original mini run and second Sol run use different prompt versions; do not attribute those differences solely to the model.',difference:'Mini made no calls and incorrectly said 25 days exceeded 30. Sol made five calls, retrieved the store policy, applied 14 days, and cited the correct June 20 deadline.',limit:'Your note flags extra calls. Search can legitimately discover a policy ID, so not all additional calls are proven unnecessary. Sol already succeeded before the second prompt revision; that edit was not tested on mini for S04.'},M06:{finding:'Sol improved verification and human handoff in this matched pair.',conditions:'Same request, prompt 92beb0f753af, merchant identity, and shipped order state.',difference:'Mini refused without tool calls. Sol verified the order, found and read the policy, refused with a citation, and created support ticket 154.',limit:'Both models avoided cancellation. This shows better process and handoff in one pair, not a general model ranking. The Sol run created a ticket, an additional real side effect.'},M02:{finding:'No demonstrated improvement from GPT-4o; inputs were not matched.',conditions:'Same prompt version, but the GPT-4o request is truncated before the complete cancellation request and order ID.',difference:'Both models made zero calls and refused changing merchant identity. Your notes say FAIL for both, and the student finalized the mini assessment as FAIL based on the latest UI note.',limit:'The previous mini PASS is preserved in assessment history; repeat the exact full request before drawing a comparative conclusion.'}};
function renderModels(){const root=$('models');root.replaceChildren();root.append(el('h2','','Model comparison'),el('p','help','Case-level evidence: models, prompt versions, actual tool activity, and your observations. These selected single-run comparisons do not establish overall model performance. No token-cost or latency measurements were recorded.'));const analysis=analysisData.analysis;if(!analysis){root.append(el('div','empty','No saved model comparison is available yet.'));return}analysisNotice(root);
 for(const comparison of analysis.cross_model_cases){const section=el('section','card');const conclusion=comparisonConclusions[comparison.scenario_id];section.append(el('h3','',comparison.scenario_id));if(conclusion){section.append(el('p','response',conclusion.finding),el('p','help',conclusion.conditions),el('p','response',conclusion.difference),el('p','help',conclusion.limit))}
 const wrap=el('div','summary-wrap');const table=el('table','analysis-table');const head=el('thead');const hr=el('tr');for(const label of ['Run / model / prompt','Recorded tool activity','Your observation / labels']){const th=el('th','',label);th.scope='col';hr.append(th)}head.append(hr);table.append(head);const body=el('tbody');for(const run of comparison.runs){const row=el('tr');const identity=el('td');identity.append(evidenceButton(run.source_line),el('p','summary-meta',`${run.model}\nPrompt: ${run.prompt_version}`));const request=el('details');request.append(el('summary','','Exact request'),el('p','response',run.request));identity.append(request);const activity=el('td');activity.append(el('strong','',`${run.tool_call_count} tool calls`),el('p','response',run.tool_sequence.join(' → ')||'No calls. Responded directly.'));const response=el('details');response.append(el('summary','','Final agent response'),el('p','response',run.response));activity.append(response);const note=el('td');note.append(el('blockquote','response',run.student_observation||'No saved observation.'),el('p','summary-meta',`Structured label: ${run.structured_label===true?'PASS':run.structured_label===false?'FAIL':'PENDING'}`));row.append(identity,activity,note);body.append(row)}table.append(body);wrap.append(table);section.append(wrap);root.append(section)}
 const repeats=el('div','card');repeats.append(el('h3','','Other reruns and limitations'),el('p','response','M01 used the same mini model and prompt: your first note says FAIL and the repeat says PASS, showing within-model variation. M07 used the same model, but the second run started with an already-cancelled order, so it tests a different state. S01 lacks model metadata in JSONL. The optional remaining support scenarios were waived; R01 supplies support-role coverage and demonstrates refund-history lookup. C01 records the accepted prompt improvement.'));root.append(repeats)
}

async function load(){const button=$('refresh');button.disabled=true;try{let data;if(offlineData){data=offlineData.records;analysisData=offlineData.analysis_data}else{const responses=await Promise.all([fetch('/api/conversations',{cache:'no-store'}),fetch('/api/analysis',{cache:'no-store'})]);if(!responses[0].ok)throw Error(`Unable to load records (HTTP ${responses[0].status})`);data=await responses[0].json();analysisData=responses[1].ok?await responses[1].json():{analysis:null,report:'',stale:false}}conversations=data.conversations;$('errors').replaceChildren();for(const error of data.errors)$('errors').append(el('div','notice',error));if(!conversations.some(item=>item.line===selected))selected=conversations[0]?.line??null;setView(view)}catch(error){$('errors').replaceChildren(el('div','notice',error.message))}finally{button.disabled=false}}
window.addEventListener('beforeunload',event=>{if(drafts.size){event.preventDefault();event.returnValue=''}});
for(const tab of ['conversation','summary','themes','models'])$(tab+'-tab').onclick=()=>setView(tab);
if(offlineData){document.body.classList.add('snapshot');$('refresh').hidden=true;$('download').hidden=true;$('snapshot-banner').hidden=false;$('snapshot-banner').textContent=`Shared snapshot · exported ${offlineData.exported_at} · ${offlineData.records.conversations.length} recorded runs. Read-only; no server or internet connection needed. This snapshot includes recorded evidence only. The optional 25-case plan was not completed; video recording status is separate.`;document.querySelector('aside .help').textContent='Embedded snapshot of hw1-session.jsonl. Select a run to review its saved evidence and observations.'}
$('refresh').onclick=load;$('search').oninput=list;load();
</script>
